<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Ads - YCash Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Styles identiques à l'original, conservés */
        :root {
            --primary: #00f2fe; --primary-dark: #00d4ff; --accent: #ff00cc;
            --success: #00ff88; --danger: #ff5757; --warning: #ffc107;
            --dark: #0f172a; --darker: #1e293b; --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(125deg, #0f172a, #1e293b, #0f172a);
            background-attachment: fixed; color: white; min-height: 100vh;
        }
        header { position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
        .user-badge { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; }
        .back-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .logo-container { text-align: center; font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; color: var(--primary); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-item { background: rgba(0, 242, 254, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; text-align: center; }
        .stat-label { color: #aaa; font-size: 0.8rem; text-transform: uppercase; }
        .stat-value { color: var(--primary); font-size: 1.3rem; font-weight: bold; }
        .surf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .surf-card { background: var(--glass); border: 2px solid var(--glass-border); border-radius: 20px; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; }
        .surf-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .btn-visit { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--dark); border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .timer { font-size: 1.5rem; font-weight: bold; color: var(--warning); text-align: center; margin: 10px 0; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 1s linear; }
        .btn-validate { background: var(--success); color: var(--dark); border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        /* Chat & Alerts styles conservés... */
        .chat-toggle { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; color: white; font-size: 2rem; cursor: pointer; z-index: 9999; }
        .chat-panel { position: fixed; bottom: 100px; right: 30px; width: 350px; height: 500px; background: var(--darker); border: 2px solid var(--primary); border-radius: 20px; display: none; flex-direction: column; z-index: 9998; }
        .chat-panel.active { display: flex; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">🏄 SURF ADS</div>
            <div class="header-actions">
                <div class="user-badge" id="user-badge">Chargement...</div>
                <a href="index.html" class="back-link">← Retour</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="logo-container">🏄 PUBLICITÉS DISPONIBLES</div>
        <div id="message-container"></div>

        <div class="stats-grid">
            <div class="stat-item"><div class="stat-label">Vues</div><div class="stat-value" id="stat-viewed">0</div></div>
            <div class="stat-item"><div class="stat-label">Disponibles</div><div class="stat-value" id="stat-available">0</div></div>
            <div class="stat-item"><div class="stat-label">Solde</div><div class="stat-value" id="stat-balance">0.0000$</div></div>
            <div class="stat-item"><div class="stat-label">Aujourd'hui</div><div class="stat-value" id="stat-today">0.0000$</div></div>
        </div>

        <div id="surf-grid" class="surf-grid"></div>
    </div>

    <button class="chat-toggle" id="chat-toggle">💬</button>
    <div class="chat-panel" id="chat-panel">
        <div style="background:var(--primary); padding:15px; color:var(--dark); font-weight:bold;">Chat Direct</div>
        <div id="chat-messages" style="flex:1; padding:15px; overflow-y:auto;"></div>
        <div style="padding:10px; display:flex; gap:5px;">
            <input type="text" id="chat-input" style="flex:1; padding:8px; border-radius:10px; border:1px solid var(--glass-border); background:#000; color:#fff;">
            <button id="chat-send" style="background:var(--primary); border:none; padding:8px 15px; border-radius:10px; cursor:pointer;">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, collection, query, where, getDocs, increment, serverTimestamp, onSnapshot, setDoc, getDoc, runTransaction, arrayUnion, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwPBl7Cq2v_fyza9d3o_SwvYbDAk4hzcA",
            authDomain: "ycash-enpire-v2.firebaseapp.com",
            projectId: "ycash-enpire-v2",
            storageBucket: "ycash-enpire-v2.firebasestorage.app",
            messagingSenderId: "697841513435",
            appId: "1:697841513435:web:b5a808cf8572e96c7f6dfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let surfs = [];
        let activeSurfId = null;
        let timerInterval = null;
        let timerEndTime = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUser = user;
            document.getElementById('user-badge').innerText = user.email;

            // Stats en temps réel
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById('stat-balance').innerText = (d.balance || 0).toFixed(4) + '$';
                    document.getElementById('stat-viewed').innerText = d.surfViews || 0;
                    const today = new Date().toDateString();
                    document.getElementById('stat-today').innerText = (d.lastSurfDate === today ? (d.dailySurfEarnings || 0) : 0).toFixed(4) + '$';
                }
            });

            loadSurfs();
            listenForAlerts();
        });

        async function loadSurfs() {
            const snapshot = await getDocs(query(collection(db, "surfs"), where("status", "==", "active")));
            const todayStr = new Date().toDateString();
            
            const promises = snapshot.docs.map(async (sDoc) => {
                const surfData = sDoc.data();
                // Ne garder que celles avec des clics restants
                if (surfData.clicksRemaining <= 0) return null;

                const viewSnap = await getDoc(doc(db, "surfs", sDoc.id, "views", currentUser.uid));
                const lastView = viewSnap.exists() ? viewSnap.data().viewedAt?.toDate().toDateString() : null;
                
                // Disponible si pas de vue aujourd'hui
                if (lastView !== todayStr) {
                    return { id: sDoc.id, ...surfData };
                }
                return null;
            });

            surfs = (await Promise.all(promises)).filter(s => s !== null);
            renderSurfs();
        }

        function renderSurfs() {
            const grid = document.getElementById('surf-grid');
            document.getElementById('stat-available').innerText = surfs.length;

            if (surfs.length === 0) {
                grid.innerHTML = `<div style="text-align:center; width:100%; padding:40px; border:2px dashed var(--glass-border); border-radius:20px;">
                    <h3>Plus de pubs pour aujourd'hui !</h3><p>Revenez demain à minuit (00h00).</p></div>`;
                return;
            }

            grid.innerHTML = surfs.map(surf => `
                <div class="surf-card" id="card-${surf.id}">
                    <h3 style="color:var(--primary); margin-bottom:10px;">${surf.title}</h3>
                    <p style="font-size:0.8rem; opacity:0.6; margin-bottom:15px;">${surf.url}</p>
                    <div style="display:flex; justify-content:space-between; font-weight:bold;">
                        <span style="color:var(--success)">+${surf.reward.toFixed(4)}$</span>
                        <span style="color:var(--warning)">${surf.duration}s</span>
                    </div>
                    <div id="container-${surf.id}">
                        <button class="btn-visit" onclick="window.visitSurf('${surf.id}')">VISITER LA PUB</button>
                    </div>
                </div>
            `).join('');
        }

        window.visitSurf = (id) => {
            if (activeSurfId) return;
            const surf = surfs.find(s => s.id === id);
            if (!surf) return;
            activeSurfId = id;
            timerEndTime = Date.now() + surf.duration * 1000;
            window.open(surf.url, '_blank');

            const container = document.getElementById(`container-${id}`);
            container.innerHTML = `
                <div class="timer" id="timer-${id}">${surf.duration}s</div>
                <div class="progress-bar"><div class="progress-fill" id="fill-${id}" style="width:100%; transition: width ${surf.duration}s linear;"></div></div>
            `;

            let timeLeft = surf.duration;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById(`timer-${id}`).innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    container.innerHTML = `<button class="btn-validate" onclick="window.validateSurf('${id}')">✅ RÉCUPÉRER MON GAIN</button>`;
                }
            }, 1000);
        };

        window.validateSurf = async (surfId) => {
            if (activeSurfId !== surfId) return;

            const surf = surfs.find(s => s.id === surfId);
            if (!surf) return;

            // Effet visuel
            const card = document.getElementById(`card-${surfId}`);
            if (card) {
                card.style.opacity = "0.5";
                card.style.transform = "scale(0.95)";
                card.style.transition = "0.3s";
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const userRef = doc(db, "users", currentUser.uid);
                    const userSnap = await transaction.get(userRef);
                    const userData = userSnap.data();

                    const surfRef = doc(db, "surfs", surfId);
                    const surfSnap = await transaction.get(surfRef);
                    const sData = surfSnap.data();

                    if (sData.clicksRemaining <= 0) throw new Error("Publicité épuisée");

                    const reward = sData.reward || 0;
                    const today = new Date().toDateString();

                    // Mise à jour utilisateur
                    transaction.update(userRef, {
                        balance: increment(reward),
                        surfViews: increment(1),
                        lastSurfDate: today,
                        dailySurfEarnings: (userData.lastSurfDate === today) ? increment(reward) : reward
                    });

                    // Mise à jour de la surf (clicksCompleted avec majuscule)
                    transaction.update(surfRef, {
                        clicksRemaining: increment(-1),
                        clicksCompleted: increment(1)
                    });

                    // Enregistrement de la vue
                    const viewRef = doc(db, "surfs", surfId, "views", currentUser.uid);
                    transaction.set(viewRef, {
                        viewedAt: serverTimestamp(),
                        userId: currentUser.uid
                    });
                });

                showMessage(`✅ +${surf.reward.toFixed(4)}$ gagnés !`, 'success');

                // Nettoyage
                clearInterval(timerInterval);
                activeSurfId = null;
                timerInterval = null;

                // Recharger la liste complète pour mettre à jour les stats
                setTimeout(() => loadSurfs(), 500);

            } catch (error) {
                console.error("Erreur:", error);
                showMessage("Erreur : " + error.message, "error");
                if (card) {
                    card.style.opacity = "1";
                    card.style.transform = "scale(1)";
                }
            }
        };

        function showMessage(message, type = 'success') {
            const container = document.getElementById('message-container');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            div.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
            container.innerHTML = '';
            container.appendChild(div);
            if (type === 'success') {
                setTimeout(() => div.remove(), 4000);
            }
        }

        // ========== CHAT ==========
        const chatToggle = document.getElementById('chat-toggle');
        const chatPanel = document.getElementById('chat-panel');
        const chatClose = document.getElementById('chat-close');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        chatToggle.addEventListener('click', () => {
            chatPanel.classList.toggle('active');
            if (chatPanel.classList.contains('active') && currentUser) loadChatMessages();
        });

        chatClose.addEventListener('click', () => chatPanel.classList.remove('active'));

        const chatRef = doc(db, "chats", "global");

        function loadChatMessages() {
            if (!currentUser) return;
            onSnapshot(chatRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    const messages = data.messages || [];
                    displayChatMessages(messages);
                }
            });
        }

        function displayChatMessages(messages) {
            messages.sort((a, b) => a.timestamp - b.timestamp);
            chatMessages.innerHTML = messages.map(msg => {
                const isOwn = msg.userId === currentUser?.uid;
                const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString() : '';
                return `
                    <div class="chat-message ${isOwn ? 'own' : ''}">
                        <div class="sender">${isOwn ? 'Moi' : escapeHtml(msg.userEmail)}</div>
                        <div class="text">${escapeHtml(msg.message)}</div>
                        <div class="time">${time}</div>
                    </div>
                `;
            }).join('');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSend.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;

            try {
                const chatSnap = await getDoc(chatRef);
                let messages = [];
                if (chatSnap.exists()) {
                    messages = chatSnap.data().messages || [];
                }
                messages.push({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    message: message,
                    timestamp: serverTimestamp()
                });
                if (messages.length > 100) messages = messages.slice(-100);
                await setDoc(chatRef, { messages }, { merge: true });
                chatInput.value = '';
            } catch (error) {
                console.error("Erreur envoi message:", error);
                showMessage("Erreur envoi message", "error");
            }
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') chatSend.click();
        });

        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                if(m === '"') return '&quot;';
                return m;
            });
        }

        // ========== ALERTES ==========
        const alertContainer = document.getElementById('alert-container');

        function listenForAlerts() {
            if (!currentUser) return;
            
            const alertsRef = collection(db, "alerts");
            const q = query(alertsRef, where("target", "in", ["all", currentUser.uid]), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const alert = { id: change.doc.id, ...change.doc.data() };
                        if (alert.target !== "all" && alert.readBy && alert.readBy.includes(currentUser.uid)) return;
                        showAlertToast(alert.message, alert.target === "all" ? 'info' : 'warning');
                        if (alert.target !== "all") {
                            updateDoc(doc(db, "alerts", alert.id), {
                                readBy: arrayUnion(currentUser.uid)
                            }).catch(console.error);
                        }
                    }
                });
            });
        }

        function showAlertToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `alert-toast ${type}`;
            toast.innerText = message;
            toast.onclick = () => toast.remove();
            alertContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 10000);
        }
    </script>
</body>
</html>

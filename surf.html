<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Ads - YCash Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --primary-dark: #00d4ff;
            --accent: #ff00cc;
            --success: #00ff88;
            --danger: #ff5757;
            --warning: #ffc107;
            --dark: #0f172a;
            --darker: #1e293b;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(125deg, #0f172a, #1e293b, #0f172a);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .back-link {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 8px;
            transition: 0.3s;
            text-decoration: none;
        }

        .back-link:hover {
            background: var(--glass);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .logo-container {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: var(--primary);
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #message-container {
            margin-bottom: 20px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            animation: slideDown 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.error {
            background: rgba(255, 87, 87, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .message.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        /* Grille des publicités */
        .surf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .surf-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .surf-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }

        .surf-card.completed {
            opacity: 0.5;
            filter: grayscale(0.8);
            pointer-events: none;
        }

        .surf-card .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .surf-card .url {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .surf-card .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .surf-card .reward {
            color: var(--success);
            font-weight: bold;
        }

        .surf-card .duration {
            color: var(--warning);
        }

        .surf-card .btn-visit {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--dark);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .surf-card .btn-visit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
        }

        .surf-card .btn-visit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .surf-card .timer {
            margin-top: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--warning);
        }

        .surf-card .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .surf-card .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 1s linear;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,87,87,0.05);
            border: 2px solid var(--danger);
            border-radius: 20px;
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* ========== CHAT WIDGET ========== */
        .chat-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,242,254,0.4);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .chat-toggle:hover {
            transform: scale(1.1);
        }
        .chat-panel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            height: 500px;
            background: var(--darker);
            border: 2px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-panel.active {
            display: flex;
        }
        .chat-header {
            background: var(--primary);
            color: var(--dark);
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-close {
            background: none;
            border: none;
            color: var(--dark);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px;
            max-width: 80%;
            align-self: flex-start;
        }
        .chat-message.own {
            background: rgba(0,242,254,0.2);
            align-self: flex-end;
        }
        .chat-message .sender {
            font-size: 0.7rem;
            color: var(--primary);
            margin-bottom: 3px;
        }
        .chat-message .text {
            font-size: 0.9rem;
            word-wrap: break-word;
        }
        .chat-message .time {
            font-size: 0.6rem;
            color: #aaa;
            text-align: right;
            margin-top: 3px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid var(--glass-border);
        }
        .chat-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 15px;
            color: white;
            outline: none;
        }
        .chat-input:focus {
            border-color: var(--primary);
        }
        .chat-send {
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            color: var(--dark);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .chat-send:hover {
            transform: scale(1.1);
        }

        /* ========== ALERT NOTIFICATION ========== */
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .alert-toast {
            background: rgba(255,87,87,0.9);
            border: 2px solid var(--danger);
            border-radius: 10px;
            padding: 15px 20px;
            color: white;
            max-width: 350px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(255,87,87,0.3);
            cursor: pointer;
        }
        .alert-toast.info {
            background: rgba(0,242,254,0.9);
            border-color: var(--primary);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .footer-nav {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--glass-border);
        }

        .footer-nav a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 15px;
            transition: 0.3s;
        }

        .footer-nav a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            .logo-container {
                font-size: 1.6rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .chat-panel { width: 300px; right: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">🏄 SURF ADS</div>
            <div class="header-actions">
                <div class="user-badge" id="user-badge">Non connecté</div>
                <a href="index.html" class="back-link">← Retour</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="logo-container">🏄 CHOISISSEZ VOTRE PUB</div>

        <div id="message-container"></div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Publicités vues</div>
                <div class="stat-value" id="stat-viewed">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Disponibles</div>
                <div class="stat-value" id="stat-available">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Solde total</div>
                <div class="stat-value" id="stat-balance">0.0000$</div> <!-- Affiché avec 4 décimales -->
            </div>
            <div class="stat-item">
                <div class="stat-label">Gagné aujourd'hui</div>
                <div class="stat-value" id="stat-today">0.0000$</div> <!-- Affiché avec 4 décimales -->
            </div>
        </div>

        <div id="surf-grid" class="surf-grid">
            <!-- Les cartes seront injectées ici -->
        </div>

        <div class="footer-nav">
            <a href="index.html">← Accueil</a>
            <a href="tasks.html">Missions →</a>
        </div>
    </div>

    <!-- ========== CHAT WIDGET ========== -->
    <button class="chat-toggle" id="chat-toggle" title="Chat en direct">💬</button>
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">
            <span>Chat en direct</span>
            <button class="chat-close" id="chat-close">&times;</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Votre message...">
            <button class="chat-send" id="chat-send">➤</button>
        </div>
    </div>

    <!-- ========== ALERT CONTAINER ========== -->
    <div class="alert-container" id="alert-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, doc, updateDoc, collection, query, where, getDocs, increment, serverTimestamp, onSnapshot, setDoc, getDoc, writeBatch, arrayUnion, orderBy
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwPBl7Cq2v_fyza9d3o_SwvYbDAk4hzcA",
            authDomain: "ycash-enpire-v2.firebaseapp.com",
            projectId: "ycash-enpire-v2",
            storageBucket: "ycash-enpire-v2.firebasestorage.app",
            messagingSenderId: "697841513435",
            appId: "1:697841513435:web:b5a808cf8572e96c7f6dfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let surfs = [];               // Toutes les surfs actives avec leur statut pour cet utilisateur
        let activeSurfId = null;      // ID de la surf en cours de visionnage
        let timerInterval = null;
        let timerEndTime = null;      // Timestamp de fin du timer (pour gérer rafraîchissement)

        // Coefficient multiplicateur selon le niveau (identique aux missions)
        function getLevelMultiplier(level) {
            if (level >= 10) return 1.20;
            if (level >= 5) return 1.10;
            if (level >= 2) return 1.05;
            return 1.0;
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showMessage("Vous devez être connecté", "error");
                setTimeout(() => window.location.href = "index.html", 2000);
                return;
            }

            currentUser = user;
            document.getElementById('user-badge').innerText = user.email;

            // Real-time user data
            const userRef = doc(db, "users", user.uid);
            onSnapshot(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.data();
                    // Affichage avec 4 décimales pour voir les petits gains
                    document.getElementById('stat-balance').innerText = (userData.balance || 0).toFixed(4) + '$';
                    document.getElementById('stat-viewed').innerText = userData.surfViews || 0;
                    
                    const today = new Date().toDateString();
                    if (userData.lastSurfDate === today) {
                        document.getElementById('stat-today').innerText = (userData.dailySurfEarnings || 0).toFixed(4) + '$';
                    } else {
                        document.getElementById('stat-today').innerText = '0.0000$';
                    }
                }
            });

            await loadSurfs();
            listenForAlerts();
        });

        // ========== CHARGER LES SURFS ==========
        async function loadSurfs() {
            try {
                const surfsRef = collection(db, "surfs");
                const q = query(surfsRef, where("status", "==", "active"));
                const snapshot = await getDocs(q);

                const allActiveSurfs = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                })).filter(s => s.clicksRemaining > 0);

                // Récupérer pour chaque surf la dernière vue de l'utilisateur
                const surfPromises = allActiveSurfs.map(async (surf) => {
                    const viewRef = doc(db, "surfs", surf.id, "views", currentUser.uid);
                    const viewSnap = await getDoc(viewRef);
                    let viewData = null;
                    if (viewSnap.exists()) {
                        viewData = viewSnap.data();
                    }
                    return { ...surf, viewData };
                });

                surfs = await Promise.all(surfPromises);

                // Trier par date de création (ordre chronologique)
                surfs.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

                renderSurfs();

            } catch (error) {
                console.error("Erreur chargement:", error);
                showMessage("Erreur: " + error.message, "error");
            }
        }

        // ========== AFFICHER LES CARTES ==========
        function renderSurfs() {
            const grid = document.getElementById('surf-grid');
            const now = new Date();

            // Compter les disponibles (jamais vues ou vue > 24h)
            const available = surfs.filter(s => {
                if (!s.viewData) return true;
                const lastView = s.viewData.viewedAt.toDate();
                const hoursSince = (now - lastView) / (1000 * 60 * 60);
                return hoursSince >= 24;
            });

            document.getElementById('stat-available').innerText = available.length;

            if (surfs.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 4rem;">📭</div>
                        <h2>Aucune publicité disponible</h2>
                        <p>Revenez plus tard, de nouvelles campagnes seront ajoutées.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            surfs.forEach(surf => {
                const isAvailable = !surf.viewData || ((now - surf.viewData.viewedAt.toDate()) / (1000 * 60 * 60) >= 24);
                const isActive = (activeSurfId === surf.id);
                const isCompleted = !isAvailable && !isActive; // déjà vue récemment et pas en cours

                // Calcul du temps restant si en cours
                let remainingSeconds = 0;
                if (isActive && timerEndTime) {
                    remainingSeconds = Math.max(0, Math.floor((timerEndTime - Date.now()) / 1000));
                }

                html += `
                    <div class="surf-card ${isCompleted ? 'completed' : ''}" id="surf-${surf.id}">
                        <div class="title">${surf.title}</div>
                        <div class="url">${surf.url}</div>
                        <div class="stats">
                            <span class="reward">💰 ${surf.reward.toFixed(4)}$</span>
                            <span class="duration">⏱️ ${surf.duration}s</span>
                        </div>
                        ${!isCompleted ? `
                            <button class="btn-visit" 
                                onclick="visitSurf('${surf.id}')" 
                                ${isActive ? 'disabled' : ''}
                                ${!isAvailable ? 'disabled' : ''}>
                                ${isActive ? 'EN COURS...' : '🌐 VISITER'}
                            </button>
                        ` : `
                            <button class="btn-visit" disabled style="background: #555;">
                                ⏳ REVIENT DANS 24H
                            </button>
                        `}
                        ${isActive ? `
                            <div class="timer" id="timer-${surf.id}">${remainingSeconds}s</div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-${surf.id}" style="width: ${((surf.duration - remainingSeconds) / surf.duration) * 100}%;"></div>
                            </div>
                            <button class="btn-success" id="validate-${surf.id}" style="display: ${remainingSeconds <= 0 ? 'block' : 'none'}; margin-top: 10px; background: var(--success); color: var(--dark); border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="validateSurf('${surf.id}')">
                                ✅ VALIDER
                            </button>
                        ` : ''}
                    </div>
                `;
            });

            grid.innerHTML = html;

            // Si une pub est active, on relance l'affichage du timer
            if (activeSurfId) {
                startTimerDisplay(activeSurfId);
            }
        }

        // ========== VISITER UNE SURF ==========
        window.visitSurf = async (surfId) => {
            if (activeSurfId) {
                showMessage("Vous avez déjà une publicité en cours", "warning");
                return;
            }

            const surf = surfs.find(s => s.id === surfId);
            if (!surf) return;

            // Vérifier une dernière fois que c'est disponible
            if (surf.viewData) {
                const lastView = surf.viewData.viewedAt.toDate();
                const hoursSince = (new Date() - lastView) / (1000 * 60 * 60);
                if (hoursSince < 24) {
                    showMessage("Cette publicité a été vue il y a moins de 24h", "error");
                    await loadSurfs(); // recharger
                    return;
                }
            }

            // Ouvrir l'URL
            window.open(surf.url, '_blank');

            // Activer le timer
            activeSurfId = surfId;
            timerEndTime = Date.now() + surf.duration * 1000;
            renderSurfs(); // réaffiche avec le timer

            // Démarrer le compte à rebours
            startTimerDisplay(surfId);
        };

        // ========== GESTION DU TIMER ==========
        function startTimerDisplay(surfId) {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const surf = surfs.find(s => s.id === surfId);
                if (!surf || activeSurfId !== surfId) {
                    clearInterval(timerInterval);
                    return;
                }

                const now = Date.now();
                const remaining = Math.max(0, Math.floor((timerEndTime - now) / 1000));

                // Mise à jour du texte du timer
                const timerElem = document.getElementById(`timer-${surfId}`);
                if (timerElem) timerElem.innerText = remaining + 's';

                // Mise à jour de la barre de progression
                const progress = ((surf.duration - remaining) / surf.duration) * 100;
                const progressElem = document.getElementById(`progress-${surfId}`);
                if (progressElem) progressElem.style.width = progress + '%';

                // Afficher le bouton valider quand temps écoulé
                const validateBtn = document.getElementById(`validate-${surfId}`);
                if (validateBtn) {
                    if (remaining <= 0) {
                        validateBtn.style.display = 'block';
                    } else {
                        validateBtn.style.display = 'none';
                    }
                }

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        }

        // ========== VALIDER LE SURF ==========
        window.validateSurf = async (surfId) => {
            if (activeSurfId !== surfId) return;

            const surf = surfs.find(s => s.id === surfId);
            if (!surf) return;

            // Vérifier que le timer est bien fini
            if (Date.now() < timerEndTime) {
                showMessage("Le temps n'est pas encore écoulé", "warning");
                return;
            }

            // Empêcher double clic
            const btn = document.getElementById(`validate-${surfId}`);
            if (btn) btn.disabled = true;

            try {
                // Récupérer l'utilisateur pour le niveau et le parrain
                const userRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.data();
                const level = userData.level || 1;
                const multiplier = getLevelMultiplier(level);
                const finalReward = surf.reward * multiplier;

                const batch = writeBatch(db);

                // Mettre à jour l'utilisateur
                const today = new Date().toDateString();
                let dailyEarnings = finalReward;
                if (userData.lastSurfDate === today) {
                    dailyEarnings = (userData.dailySurfEarnings || 0) + finalReward;
                }

                batch.update(userRef, {
                    balance: increment(finalReward),
                    totalEarned: increment(finalReward),
                    surfViews: increment(1),
                    lastSurfDate: today,
                    dailySurfEarnings: dailyEarnings,
                    lastLogin: serverTimestamp()
                });

                // Commission parrain (10%)
                if (userData.referredBy) {
                    const commission = finalReward * 0.10;
                    const referrerRef = doc(db, "users", userData.referredBy);
                    batch.update(referrerRef, {
                        balance: increment(commission),
                        referralEarnings: increment(commission)
                    });
                }

                // Mettre à jour la surf
                const surfRef = doc(db, "surfs", surfId);
                batch.update(surfRef, {
                    clicksRemaining: increment(-1),
                    clicksCompleted: increment(1)
                });

                // Enregistrer la vue (écrase l'ancienne)
                const viewRef = doc(db, "surfs", surfId, "views", currentUser.uid);
                batch.set(viewRef, {
                    userId: currentUser.uid,
                    viewedAt: serverTimestamp(),
                    earned: finalReward
                });

                await batch.commit();

                showMessage(`✅ +${finalReward.toFixed(4)}$ gagnés ! (Niveau ${level} : x${multiplier.toFixed(2)})`, 'success');

                // Réinitialiser l'état actif
                activeSurfId = null;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                // Recharger les données pour mettre à jour la liste (la surf devient complétée)
                await loadSurfs();

            } catch (error) {
                console.error("Erreur validation:", error);
                showMessage("Erreur: " + error.message, "error");
                if (btn) btn.disabled = false;
            }
        };

        // ========== MESSAGE ==========
        function showMessage(message, type = 'success') {
            const container = document.getElementById('message-container');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            div.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
            container.innerHTML = '';
            container.appendChild(div);
            if (type === 'success' || type === 'warning') {
                setTimeout(() => div.remove(), 4000);
            }
        }

        // ========== CHAT ==========
        const chatToggle = document.getElementById('chat-toggle');
        const chatPanel = document.getElementById('chat-panel');
        const chatClose = document.getElementById('chat-close');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        chatToggle.addEventListener('click', () => {
            chatPanel.classList.toggle('active');
            if (chatPanel.classList.contains('active') && currentUser) loadChatMessages();
        });
        chatClose.addEventListener('click', () => chatPanel.classList.remove('active'));

        const chatRef = doc(db, "chats", "global");

        function loadChatMessages() {
            if (!currentUser) return;
            onSnapshot(chatRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    const messages = data.messages || [];
                    displayChatMessages(messages);
                }
            });
        }

        function displayChatMessages(messages) {
            messages.sort((a, b) => a.timestamp - b.timestamp);
            chatMessages.innerHTML = messages.map(msg => {
                const isOwn = msg.userId === currentUser?.uid;
                const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString() : '';
                return `
                    <div class="chat-message ${isOwn ? 'own' : ''}">
                        <div class="sender">${isOwn ? 'Moi' : escapeHtml(msg.userEmail)}</div>
                        <div class="text">${escapeHtml(msg.message)}</div>
                        <div class="time">${time}</div>
                    </div>
                `;
            }).join('');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSend.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            try {
                const chatSnap = await getDoc(chatRef);
                let messages = [];
                if (chatSnap.exists()) messages = chatSnap.data().messages || [];
                messages.push({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    message: message,
                    timestamp: serverTimestamp()
                });
                if (messages.length > 100) messages = messages.slice(-100);
                await setDoc(chatRef, { messages }, { merge: true });
                chatInput.value = '';
            } catch (error) {
                console.error("Erreur envoi message:", error);
                showMessage("Erreur envoi message", "error");
            }
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') chatSend.click();
        });

        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                if(m === '"') return '&quot;';
                return m;
            });
        }

        // ========== ALERTES ==========
        const alertContainer = document.getElementById('alert-container');

        function listenForAlerts() {
            if (!currentUser) return;
            const alertsRef = collection(db, "alerts");
            const q = query(alertsRef, where("target", "in", ["all", currentUser.uid]), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const alert = { id: change.doc.id, ...change.doc.data() };
                        if (alert.target !== "all" && alert.readBy && alert.readBy.includes(currentUser.uid)) return;
                        showAlertToast(alert.message, alert.target === "all" ? 'info' : 'warning');
                        if (alert.target !== "all") {
                            updateDoc(doc(db, "alerts", alert.id), {
                                readBy: arrayUnion(currentUser.uid)
                            }).catch(console.error);
                        }
                    }
                });
            });
        }

        function showAlertToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `alert-toast ${type}`;
            toast.innerText = message;
            toast.onclick = () => toast.remove();
            alertContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 10000);
        }
    </script>

</body>
</html>

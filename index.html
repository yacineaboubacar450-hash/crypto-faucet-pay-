<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YCash Empire - Gagner de l'argent en ligne</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ========== VARIABLES DESIGN ========== */
        :root {
            --primary: #00f2fe; --primary-dark: #00d4ff; --accent: #ff00cc;
            --success: #00ff88; --danger: #ff5757; --warning: #ffc107;
            --dark: #0a0e27; --darker: #0f1729; --card-bg: rgba(20, 30, 60, 0.6);
            --glass: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2847 50%, #0d1629 100%);
            background-attachment: fixed; color: white; overflow-x: hidden;
        }

        /* HEADER & LOGO */
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* MAIN CONTENT */
        main { margin-top: 100px; padding: 20px; }
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        /* ACTIONS GRID */
        .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .action-card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s; }
        .action-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .btn-action { width: 100%; padding: 10px; margin-top: 15px; border-radius: 10px; border: none; background: var(--primary); font-weight: bold; cursor: pointer; }

        /* AUTH OVERLAY (Fenêtre de connexion) */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 10000;
        }
        .auth-card { background: var(--darker); padding: 40px; border-radius: 25px; border: 2px solid var(--primary); text-align: center; max-width: 400px; }
        .btn-google { background: white; color: black; padding: 12px; width: 100%; border-radius: 10px; border: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-top: 20px; }

        /* ALERT TOAST */
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 10px; z-index: 11000; animation: slideUp 0.3s ease; }
        .success { background: var(--success); color: var(--dark); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* CHAT */
        .chat-toggle { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); border: none; font-size: 1.5rem; cursor: pointer; z-index: 999; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">👑 YCASH EMPIRE</div>
            <div id="user-info" style="display:none; align-items:center; gap:15px;">
                <span id="user-email-header" style="font-size: 0.8rem; color:#aaa;"></span>
                <button onclick="logoutUser()" style="background:none; border:1px solid var(--danger); color:var(--danger); padding:5px 10px; border-radius:5px; cursor:pointer;">Sortir</button>
            </div>
        </div>
    </header>

    <main>
  <div id="captcha-space" style="
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 300px; 
    width: 100%; 
    margin: 40px 0; 
    background: rgba(255, 255, 255, 0.03); 
    border-radius: 20px;
    border: 1px dashed var(--glass-border);
">
    </div>

        <section id="user-dashboard" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card"><div>Solde</div><div class="stat-value" id="stat-balance">0.00$</div></div>
                <div class="stat-card"><div>Total Gagné</div><div class="stat-value" id="stat-total-earned">0.00$</div></div>
                <div class="stat-card"><div>Filleuls</div><div class="stat-value" id="ref-count">0</div></div>
            </div>

            <div class="actions-grid">
                <div class="action-card" onclick="location.href='surf.html'">
                    <h3>🏄 Surf Ads</h3>
                    <p>Gagnez en regardant des pubs.</p>
                    <button class="btn-action">GO</button>
                </div>
                <div class="action-card" onclick="location.href='tasks.html'">
                    <h3>📝 Missions</h3>
                    <p>Missions haute rémunération.</p>
                    <button class="btn-action">VOIR</button>
                </div>
                <div id="admin-card" class="action-card" style="display:none; border-color: gold;" onclick="location.href='admin.html'">
                    <h3>👑 Admin</h3>
                    <button class="btn-action">GÉRER</button>
                </div>
            </div>
        </section>
    </main>

    <div id="google-auth-block" class="auth-overlay">
        <div class="auth-card">
            <h2>🚀 Prêt à gagner ?</h2>
            <p>Connectez-vous pour enregistrer vos gains et retirer votre argent.</p>
            <button class="btn-google" id="google-login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Continuer avec Google
            </button>
            <button onclick="dismissAuth()" style="background:none; border:none; color:#777; margin-top:15px; cursor:pointer;">Plus tard</button>
        </div>
    </div>

    <button class="chat-toggle" onclick="alert('Chat bientôt disponible !')">💬</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwPBl7Cq2v_fyza9d3o_SwvYbDAk4hzcA",
            authDomain: "ycash-enpire-v2.firebaseapp.com",
            projectId: "ycash-enpire-v2",
            storageBucket: "ycash-enpire-v2.firebasestorage.app",
            messagingSenderId: "697841513435",
            appId: "1:697841513435:web:b5a808cf8572e96c7f6dfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 1. MINUTEUR 30 SECONDES POUR GOOGLE
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (!auth.currentUser) {
                    document.getElementById('google-auth-block').style.display = 'flex';
                }
            }, 30000); // 30 secondes
        });

        // 2. GESTION DE L'UTILISATEUR
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('google-auth-block').style.display = 'none';
                document.getElementById('user-dashboard').style.display = 'block';
                document.getElementById('user-info').style.display = 'flex';
                document.getElementById('user-email-header').innerText = user.email;
                
                // Charger données et vérifier succès MyLead
                loadUserData(user);
                checkMyLeadSuccess(user);
                renderMyLeadCaptcha();

                if (user.uid === "CAKKyaeewpdItHpuHo0GaOI9BEr1") {
                    document.getElementById('admin-card').style.display = 'block';
                }
            } else {
                document.getElementById('user-dashboard').style.display = 'none';
                renderMyLeadCaptcha(); // Montrer quand même le captcha aux visiteurs
            }
        });

        // 3. FONCTION DE CHARGEMENT CAPTCHA
        function renderMyLeadCaptcha() {
            const container = document.getElementById('captcha-space');
            if (container && !document.getElementById('cpljs-mylead')) {
                container.innerHTML = `<div id="cpa-locker-174120d0-18f6-11f1-97a9-129a1c289511"></div>`;
                const script = document.createElement('script');
                script.id = 'cpljs-mylead';
                script.src = "https://bestlocker.eu/iframeLoader/174120d0-18f6-11f1-97a9-129a1c289511";
                document.body.appendChild(script);
            }
        }

        // 4. RÉCOMPENSE 0.0001
        async function checkMyLeadSuccess(user) {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('verify') === 'success') {
                const userRef = doc(db, "users", user.uid);
                await updateDoc(userRef, {
                    balance: increment(0.0001),
                    totalEarned: increment(0.0001)
                });
                showNotification("✅ Sécurité validée ! +0.0001 YCash", "success");
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // 5. CONNEXION GOOGLE
        document.getElementById('google-login-btn').onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        email: user.email, balance: 0.05, totalEarned: 0.05,
                        referralCount: 0, createdAt: serverTimestamp()
                    });
                }
            } catch (err) { console.error(err); }
        };

        // FONCTIONS GLOBALES
        window.logoutUser = () => signOut(auth);
        window.dismissAuth = () => document.getElementById('google-auth-block').style.display = 'none';
        
        function loadUserData(user) {
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if(snap.exists()){
                    const d = snap.data();
                    document.getElementById('stat-balance').innerText = (d.balance || 0).toFixed(4) + '$';
                    document.getElementById('stat-total-earned').innerText = (d.totalEarned || 0).toFixed(4) + '$';
                    document.getElementById('ref-count').innerText = d.referralCount || 0;
                }
            });
        }

        function showNotification(msg, type) {
            const n = document.createElement('div');
            n.className = `notification ${type}`;
            n.innerText = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 4000);
        }
    </script>
</body>
</html>

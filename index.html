     border-radius: 60px;            border: 2px solid gold;            pointer-events: auto;            touch-action: none;        }        .joystick-thumb {            position: absolute;            width: 50px;            height: 50px;            background: radial-gradient(circle, #ffdd99, #e0b354);            border-radius: 25px;            top: 35px;            left: 35px;            box-shadow: 0 0 10px gold;        }        .action-buttons {            position: absolute;            bottom: 80px;            right: 20px;            display: flex;            flex-direction: column;            gap: 10px;            pointer-events: auto;        }        .action-btn {            width: 55px;            height: 55px;            border-radius: 50%;            background: rgba(0,0,0,0.7);            border: 2px solid gold;            font-size: 24px;            display: flex;            align-items: center;            justify-content: center;        }        .bars {            position: absolute;            left: 20px;            bottom: 220px;            width: 180px;            pointer-events: none;        }        .bar {            width: 100%;            height: 10px;            background: #333;            border-radius: 5px;            overflow: hidden;            margin-bottom: 8px;            border: 1px solid gold;        }        .bar-fill { height: 100%; transition: width 0.1s; }        .hp-fill { background: #22aa22; }        .mana-fill { background: #3a86ff; }        .xp-fill { background: #aa66ff; }        .modal {            position: fixed;            top: 50%;            left: 50%;            transform: translate(-50%, -50%);            background: #1f1a10ee;            backdrop-filter: blur(15px);            border: 3px solid gold;            border-radius: 30px;            padding: 20px;            width: 90%;            max-width: 400px;            max-height: 80vh;            overflow-y: auto;            z-index: 200;            pointer-events: auto;            display: none;            flex-direction: column;            gap: 12px;            color: #ffecb3;        }        .modal-header {            display: flex;            justify-content: space-between;            align-items: center;            border-bottom: 1px solid gold;            margin-bottom: 10px;        }        .close-modal {            background: none;            border: none;            font-size: 24px;            cursor: pointer;            color: gold;            padding: 0;            margin: 0;        }        .floating-text {            position: absolute;            font-size: 20px;            font-weight: bold;            animation: floatUp 0.8s ease-out forwards;            pointer-events: none;            text-shadow: 1px 1px 0 black;            z-index: 300;        }        @keyframes floatUp {            0% { transform: translateY(0); opacity: 1; }            100% { transform: translateY(-70px); opacity: 0; }        }        .coin-fly {            position: absolute;            width: 20px;            height: 20px;            background: radial-gradient(circle, gold, orange);            border-radius: 50%;            box-shadow: 0 0 8px gold;            pointer-events: none;            transition: all 0.4s ease-out;            z-index: 400;        }        .time-indicator {            position: absolute;            top: 80px;            right: 10px;            background: rgba(0,0,0,0.6);            padding: 4px 8px;            border-radius: 15px;            font-size: 12px;            pointer-events: none;        }        @media (max-width: 700px) {            .action-btn { width: 45px; height: 45px; font-size: 20px; }            .joystick-container { width: 100px; height: 100px; bottom: 70px; }            .joystick-thumb { width: 40px; height: 40px; top: 30px; left: 30px; }            .bars { width: 140px; bottom: 200px; }            .modal { width: 95%; padding: 15px; }        }    </style></head><body><div id="ui">    <div class="top-bar">        <div class="left-group">            <div class="panel stats">                <div class="stat">⚔️ <span id="atk">18</span></div>                <div class="stat">🪙 <span id="coins">0</span></div>                <div class="stat">💎 <span id="gems">0</span></div>                <div class="stat">⭐ <span id="level">1</span></div>                <div class="stat">🔧 <span id="skillPoints">0</span></div>            </div>        </div>        <div class="right-group">            <button id="menuBtn">📋 MENU</button>            <button id="photoBtn">📸 PHOTO</button>        </div>    </div>    <div class="time-indicator" id="timeIndicator">☀️ Jour</div>    <div class="bars">        <div class="bar"><div class="bar-fill hp-fill" id="hpFill" style="width:100%"></div></div>        <div class="bar"><div class="bar-fill mana-fill" id="manaFill" style="width:100%"></div></div>        <div class="bar" style="height:6px;"><div class="bar-fill xp-fill" id="xpFill" style="width:0%"></div></div>    </div>    <div class="joystick-container" id="joystickZone"><div class="joystick-thumb" id="joystickThumb"></div></div>    <div class="action-buttons">        <button class="action-btn" id="attackBtn">⚔️</button>        <button class="action-btn" id="interactBtn">💬</button>        <button class="action-btn" id="aoeBtn">🔥</button>    </div></div><!-- Modal principal --><div id="mainMenuModal" class="modal">    <div class="modal-header"><h2>📋 MENU</h2><button class="close-modal" data-modal="mainMenuModal">✖</button></div>    <button id="openShopBtn">🏪 Boutique</button>    <button id="openEquipBtn">⚔️ Équipement</button>    <button id="openSkillsBtn">🌟 Compétences</button>    <button id="openCraftBtn">🔨 Craft</button>    <button id="openMountBtn">🐎 Monture</button>    <button id="openCompanionBtn">🧚 Compagnon</button>    <button id="openDailyBtn">📅 Quête journalière</button>    <button id="openLeaderboardBtn">🏆 Classement</button>    <button id="openPremiumBtn">💎 Premium</button>    <button id="shareBtn">📢 Partager</button></div><!-- Autres modales --><div id="shopModal" class="modal"><div class="modal-header"><h2>🏪 Boutique</h2><button class="close-modal" data-modal="shopModal">✖</button></div><div id="shopItems"></div></div><div id="equipModal" class="modal"><div class="modal-header"><h2>⚔️ Équipement</h2><button class="close-modal" data-modal="equipModal">✖</button></div><div id="equipSlots"></div></div><div id="skillsModal" class="modal"><div class="modal-header"><h2>🌟 Compétences</h2><button class="close-modal" data-modal="skillsModal">✖</button></div><div id="skillsTree"></div></div><div id="craftModal" class="modal"><div class="modal-header"><h2>🔨 Craft</h2><button class="close-modal" data-modal="craftModal">✖</button></div><div id="craftList"></div></div><div id="mountModal" class="modal"><div class="modal-header"><h2>🐎 Monture</h2><button class="close-modal" data-modal="mountModal">✖</button></div><div><button id="buyMountBtn">Acheter monture (100🪙)</button><div id="mountStatus"></div></div></div><div id="companionModal" class="modal"><div class="modal-header"><h2>🧚 Compagnon</h2><button class="close-modal" data-modal="companionModal">✖</button></div><div><button id="buyCompanionBtn">Acheter compagnon (50💎)</button><div id="companionStatus"></div></div></div><div id="dailyModal" class="modal"><div class="modal-header"><h2>📅 Quête journalière</h2><button class="close-modal" data-modal="dailyModal">✖</button></div><div id="dailyQuestContent"></div></div><div id="leaderboardModal" class="modal"><div class="modal-header"><h2>🏆 Classement</h2><button class="close-modal" data-modal="leaderboardModal">✖</button></div><div id="leaderboardContent"></div></div><div id="premiumModal" class="modal"><div class="modal-header"><h2>💎 Premium</h2><button class="close-modal" data-modal="premiumModal">✖</button></div><div id="premiumItems"></div></div><script type="importmap">    {        "imports": {            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"        }    }</script><script type="module">import * as THREE from 'three';import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';// -------------------- SCENE --------------------const scene = new THREE.Scene();scene.background = new THREE.Color(0x87CEEB);scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);camera.position.set(8, 6, 12);const renderer = new THREE.WebGLRenderer({ antialias: true });renderer.setSize(window.innerWidth, window.innerHeight);renderer.shadowMap.enabled = true;document.body.appendChild(renderer.domElement);const labelRenderer = new CSS2DRenderer();labelRenderer.setSize(window.innerWidth, window.innerHeight);labelRenderer.domElement.style.position = 'absolute';labelRenderer.domElement.style.top = '0px';labelRenderer.domElement.style.left = '0px';labelRenderer.domElement.style.pointerEvents = 'none';document.body.appendChild(labelRenderer.domElement);// -------------------- LIGHTS --------------------const ambient = new THREE.AmbientLight(0x404060, 0.6);scene.add(ambient);const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.0);dirLight.position.set(5, 12, 7);dirLight.castShadow = true;dirLight.shadow.mapSize.width = 1024;dirLight.shadow.mapSize.height = 1024;scene.add(dirLight);const fill = new THREE.PointLight(0x88aacc, 0.4);fill.position.set(0, 3, 0);scene.add(fill);// -------------------- GROUND --------------------const groundMat = new THREE.MeshStandardMaterial({ color: 0x5a6a4a, roughness: 0.8 });const ground = new THREE.Mesh(new THREE.PlaneGeometry(28, 28), groundMat);ground.rotation.x = -Math.PI/2;ground.position.y = -0.5;ground.receiveShadow = true;scene.add(ground);const grid = new THREE.GridHelper(30, 20, 0xaa9966, 0x665533);grid.position.y = -0.45;scene.add(grid);// -------------------- WALLS --------------------const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a });[[0,1,-13,26,2,0.5],[0,1,13,26,2,0.5],[-13,1,0,0.5,2,26],[13,1,0,0.5,2,26]].forEach(b=>{    const w = new THREE.Mesh(new THREE.BoxGeometry(b[3],b[4],b[5]), wallMat);    w.position.set(b[0],b[1],b[2]);    w.castShadow = false;    scene.add(w);});// -------------------- HOUSES --------------------const houses = [];function addHouse(x,z,w,d,h,col,roofCol=null) {    const group = new THREE.Group();    const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color: col }));    body.position.y = h/2;    body.castShadow = true;    group.add(body);    if(roofCol) {        const roof = new THREE.Mesh(new THREE.ConeGeometry(w*0.9, h*0.6, 4), new THREE.MeshStandardMaterial({ color: roofCol }));        roof.position.y = h;        group.add(roof);    }    group.position.set(x, -0.5, z);    scene.add(group);    houses.push({ x, z, w, d, group });}addHouse(0, 2, 2.5, 2.5, 2.0, 0xbc9a6c, 0xaa5533);addHouse(-3, -3, 2.0, 2.0, 1.8, 0x8a7a6a, 0xcc8866);addHouse(4, -2, 1.8, 1.8, 1.5, 0xc2a16e, 0xcc8866);addHouse(-4, 4, 1.8, 1.8, 1.5, 0xc2a16e, 0xcc8866);addHouse(3, 4, 1.8, 1.8, 1.5, 0xc2a16e, 0xcc8866);const wellBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.9,0.6,12), new THREE.MeshStandardMaterial({ color: 0xaa9988 }));wellBase.position.set(0, -0.2, -3);scene.add(wellBase);const wellRoof = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.2,0.2,6), new THREE.MeshStandardMaterial({ color: 0xccaa77 }));wellRoof.position.set(0, 0.5, -3);scene.add(wellRoof);// -------------------- PLAYER --------------------const player = new THREE.Group();const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,1.2,8), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));bodyMesh.position.y = 0.65;player.add(bodyMesh);const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.45,32,32), new THREE.MeshStandardMaterial({ color: 0xefdbb0 }));headMesh.position.y = 1.3;player.add(headMesh);const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.9,6), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));leftArm.position.set(-0.65,1.05,0);leftArm.rotation.z = 0.3;player.add(leftArm);const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.9,6), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));rightArm.position.set(0.65,1.05,0);rightArm.rotation.z = -0.3;player.add(rightArm);const swordMesh = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.85,0.12), new THREE.MeshStandardMaterial({ color: 0xddccaa, metalness: 0.8 }));swordMesh.position.set(0.7,0.85,0.2);player.add(swordMesh);player.position.set(0, -0.3, 0);player.castShadow = true;scene.add(player);// -------------------- SOUNDS --------------------const audioCtx = new (window.AudioContext || window.webkitAudioContext)();function playSound(freq, dur, vol) {    if(!audioCtx) return;    const osc = audioCtx.createOscillator();    const gain = audioCtx.createGain();    osc.connect(gain);    gain.connect(audioCtx.destination);    osc.frequency.value = freq;    gain.gain.value = vol;    osc.start();    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);    osc.stop(audioCtx.currentTime + dur);}const sounds = {    attack: () => playSound(330, 0.1, 0.25),    coin: () => playSound(880, 0.15, 0.2),    hurt: () => playSound(220, 0.2, 0.3),    magic: () => playSound(660, 0.3, 0.4),    levelup: () => playSound(440, 0.5, 0.4),    boss: () => playSound(110, 0.8, 0.5)};// -------------------- GAME STATE --------------------let hp = 100, maxHp = 100, atk = 18;let coins = 0, gems = 0;let level = 1, xp = 0, xpNeeded = 100;let skillPoints = 0;let mana = 100, maxMana = 100, manaRegen = 15;let mountActive = false, companionActive = false;let doubleGoldEnd = 0, speedMult = 1;let classChoice = null;let skills = { warrior:0, mage:0, rogue:0 };let equipment = { weapon: { name:"Épée de fer", atkBonus:0 }, armor: { name:"Tunique", hpBonus:0 }, accessory: { name:"Anneau", manaBonus:0 } };let mountLevel = 0;let totalKills = 0;let reputation = 0;let dailyQuest = null;// XP curvefunction updateXpNeeded() { xpNeeded = Math.floor(100 * Math.pow(1.2, level-1)); }function addXP(amount) {    xp += amount;    while(xp >= xpNeeded) {        xp -= xpNeeded;        level++;        skillPoints++;        updateXpNeeded();        const effect = document.createElement('div'); effect.className = 'level-up-effect';        effect.style.position = 'fixed'; effect.style.top = '50%'; effect.style.left = '50%';        effect.style.width = '200px'; effect.style.height = '200px';        effect.style.background = 'radial-gradient(circle, gold, transparent)';        effect.style.borderRadius = '50%';        effect.style.transform = 'translate(-50%, -50%) scale(0)';        effect.style.transition = 'transform 0.3s ease-out';        effect.style.pointerEvents = 'none';        document.body.appendChild(effect);        setTimeout(() => effect.style.transform = 'translate(-50%, -50%) scale(3)', 10);        setTimeout(() => effect.remove(), 400);        atk += 5;        maxHp += 20;        hp = maxHp;        if(classChoice === 'warrior') { maxHp += 5; hp += 5; atk += 2; }        if(classChoice === 'mage') { maxMana += 10; manaRegen += 2; }        if(classChoice === 'rogue') { speedMult += 0.05; }        updateUI();        showFloatingText(`⭐ NIVEAU ${level} ! +5 ATK, +20 PV`, "#ffaa66", player.position);        sounds.levelup();        if(level === 5) showFloatingText("Choisis ta classe ! (Menu → Compétences)", "#ffaa66", player.position);        if(level === 10) showFloatingText("Compétence ultime débloquée !", "#ffaa66", player.position);    }    updateUI();}function applySkills() {    let baseAtk = 18 + equipment.weapon.atkBonus;    let baseHp = 100 + equipment.armor.hpBonus;    atk = baseAtk + skills.warrior * 2;    maxHp = baseHp + skills.warrior * 10;    hp = Math.min(hp, maxHp);    manaRegen = 15 + skills.mage * 2;    speedMult = 1 + skills.rogue * 0.1;    if(classChoice === 'warrior') { atk += 5; maxHp += 20; hp = Math.min(hp, maxHp); }    if(classChoice === 'mage') { manaRegen += 5; maxMana += 30; }    if(classChoice === 'rogue') { speedMult += 0.2; }    updateUI();}function updateUI() {    document.getElementById('atk').innerText = atk;    document.getElementById('coins').innerText = coins;    document.getElementById('gems').innerText = gems;    document.getElementById('level').innerText = level;    document.getElementById('skillPoints').innerText = skillPoints;    document.getElementById('hpFill').style.width = `${(hp/maxHp)*100}%`;    document.getElementById('manaFill').style.width = `${(mana/maxMana)*100}%`;    document.getElementById('xpFill').style.width = `${(xp/xpNeeded)*100}%`;    let best = localStorage.getItem('bestCoins') || 0;    if(coins > best) { best = coins; localStorage.setItem('bestCoins', best); }    saveGame();}function showFloatingText(txt, color, pos) {    const div = document.createElement('div'); div.className = 'floating-text';    div.textContent = txt; div.style.color = color;    document.body.appendChild(div);    const vector = pos.clone().project(camera);    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;    const y = (-(vector.y * 0.5 - 0.5)) * window.innerHeight;    div.style.left = `${x}px`; div.style.top = `${y}px`;    setTimeout(() => div.remove(), 800);}function vibrate(dur) { if(navigator.vibrate) navigator.vibrate(dur); }function screenFlashRed() {    const flash = document.createElement('div');    flash.style.position = 'fixed'; flash.style.top = 0; flash.style.left = 0;    flash.style.width = '100%'; flash.style.height = '100%';    flash.style.backgroundColor = 'red'; flash.style.opacity = '0.5';    flash.style.pointerEvents = 'none'; flash.style.zIndex = 1000;    document.body.appendChild(flash);    setTimeout(() => flash.remove(), 100);}function spawnParticles(pos, color, count=10) {    for(let i=0;i<count;i++) {        const p = new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4), new THREE.MeshStandardMaterial({ color }));        p.position.copy(pos);        scene.add(p);        const vel = new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2);        let life = 0.5;        const interval = setInterval(() => {            p.position.x += vel.x*0.1; p.position.y += vel.y*0.1; p.position.z += vel.z*0.1;            life -= 0.05;            if(life <= 0) { clearInterval(interval); scene.remove(p); }        }, 50);    }}// -------------------- ENEMIES --------------------class Enemy {    constructor(x,z,type) {        this.type = type;        this.hp = type === 'goblin' ? 40 : (type === 'orc' ? 75 : 120);        this.maxHp = this.hp;        this.atk = type === 'goblin' ? 9 : (type === 'orc' ? 18 : 30);        this.group = new THREE.Group();        let color, shape;        if(type === 'goblin') { color = 0x6a8a4a; shape = new THREE.CylinderGeometry(0.45,0.5,1.0,6); }        else if(type === 'orc') { color = 0x8b5a3a; shape = new THREE.CylinderGeometry(0.6,0.65,1.3,8); }        else { color = 0xaa8866; shape = new THREE.CylinderGeometry(0.7,0.75,1.5,8); }        const body = new THREE.Mesh(shape, new THREE.MeshStandardMaterial({ color }));        body.position.y = 0.6;        this.group.add(body);        const head = new THREE.Mesh(new THREE.SphereGeometry(0.45,16,16), new THREE.MeshStandardMaterial({ color: type==='goblin'?0x8aac5a:0x9c6e4e }));        head.position.y = 1.2;        this.group.add(head);        this.group.position.set(x, -0.3, z);        scene.add(this.group);        // Barre de vie CSS2D        const div = document.createElement('div');        div.style.backgroundColor = '#330000aa';        div.style.color = '#ffaaaa';        div.style.padding = '2px 5px';        div.style.borderRadius = '10px';        div.style.fontSize = '10px';        div.style.textAlign = 'center';        div.innerHTML = `<div style="background:#ff0000; width:50px; height:4px;"><div style="background:#00ff00; width:100%; height:100%;"></div></div>${this.hp}/${this.maxHp}`;        this.label = new CSS2DObject(div);        this.label.position.set(x, 1.5, z);        scene.add(this.label);        this.state = 'idle';        this.attackCd = 0;        this.speed = 1.0 + (level * 0.05);        if(this.speed > 2.5) this.speed = 2.5;        this.calledHelp = false;    }    update(delta, playerPos) {        const dist = playerPos.distanceTo(this.group.position);        if(this.type === 'goblin' && this.hp < this.maxHp * 0.2 && this.state !== 'flee') this.state = 'flee';        if(this.state === 'idle') { if(dist < 5) this.state = 'chase'; }        else if(this.state === 'chase') {            if(dist > 8) this.state = 'idle';            else {                const dir = new THREE.Vector3().subVectors(playerPos, this.group.position).normalize();                this.group.position.x += dir.x * this.speed * delta;                this.group.position.z += dir.z * this.speed * delta;                this.label.position.copy(this.group.position);                this.label.position.y += 1.4;                if(dist < 1.5 && this.attackCd <= 0) {                    hp -= this.atk;                    if(hp < 0) hp = 0;                    updateUI();                    showFloatingText(`-${this.atk}❤️`, "#ff5555", player.position);                    vibrate(50); screenFlashRed();                    this.attackCd = 1.2;                    if(hp <= 0) showDeathAd();                }            }        } else er</button><button id="chooseMage">Mage</button><button id="chooseRogue">Voleur</button></div>' : ''}                     <button id="skillWarrior">Guerrier (+2 ATK, +10 PV) [1 pt]</button>                     <button id="skillMage">Mage (+2 mana/s) [1 pt]</button>                     <button id="skillRogue">Voleur (+10% vitesse) [1 pt]</button>                     <div>Guerrier:${skills.warrior} Mage:${skills.mage} Voleur:${skills.rogue}</div>`;    if(!classChoice && level>=5) {        document.getElementById('chooseWarrior').onclick = () => { classChoice='warrior'; applySkills(); updateUI(); refreshSkills(); };        document.getElementById('chooseMage').onclick = () => { classChoice='mage'; applySkills(); updateUI(); refreshSkills(); };        document.getElementById('chooseRogue').onclick = () => { classChoice='rogue'; applySkills(); updateUI(); refreshSkills(); };    }    document.getElementById('skillWarrior').onclick = () => { if(skillPoints>0) { skillPoints--; skills.warrior++; applySkills(); updateUI(); refreshSkills(); } };    document.getElementById('skillMage').onclick = () => { if(skillPoints>0) { skillPoints--; skills.mage++; applySkills(); updateUI(); refreshSkills(); } };    document.getElementById('skillRogue').onclick = () => { if(skillPoints>0) { skillPoints--; skills.rogue++; applySkills(); updateUI(); refreshSkills(); } };}function refreshCraft() {    const div = document.getElementById('craftList');    div.innerHTML = `<div>Potion de soin (+50 PV) - 20🪙 <button id="craftPotion">Créer</button></div>                     <div>Épée de feu (+15 ATK) - 100🪙 +5💎 <button id="craftSword">Créer</button></div>`;    document.getElementById('craftPotion').onclick = () => { if(coins>=20) { coins-=20; hp=Math.min(maxHp, hp+50); updateUI(); showFloatingText("Potion bue +50 PV","#88ff88",player.position); } };    document.getElementById('craftSword').onclick = () => { if(coins>=100 && gems>=5) { coins-=100; gems-=5; equipment.weapon={name:"Épée de feu", atkBonus:15}; applySkills(); updateUI(); showFloatingText("Épée de feu équipée !","#ffaa66",player.position); } };}function refreshPremium() {    const div = document.getElementById('premiumItems');    div.innerHTML = `<div>Aura de feu - 20💎 <button id="fireAura">Acheter</button></div>                     <div>Épée de diamant (+10 ATK) - 30💎 <button id="diamondSword">Acheter</button></div>`;    document.getElementById('fireAura').onclick = () => { if(gems>=20) { gems-=20; showFloatingText("Aura de feu équipée !","#ffaa66",player.position); } };    document.getElementById('diamondSword').onclick = () => { if(gems>=30) { gems-=30; equipment.weapon={name:"Épée de diamant", atkBonus:10}; applySkills(); updateUI(); } };}function refreshLeaderboard() {    const best = localStorage.getItem('bestCoins') || 0;    document.getElementById('leaderboardContent').innerHTML = `<div>🏆 Meilleur score : ${best}🪙</div><div>Votre score : ${coins}🪙</div>`;}// -------------------- JOYSTICK --------------------const stickZone = document.getElementById('joystickZone');const thumb = document.getElementById('joystickThumb');let joyVec = { x:0, y:0 };let joyActive = false;function updateJoystick(clientX, clientY) {    const rect = stickZone.getBoundingClientRect();    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;    let dx = clientX - cx, dy = clientY - cy;    const maxDist = rect.width/2 - 5;    const dist = Math.hypot(dx, dy);    if(dist > maxDist) { dx = dx * maxDist / dist; dy = dy * maxDist / dist; }    thumb.style.transform = `translate(${dx}px, ${dy}px)`;    joyVec.x = dx / maxDist;    joyVec.y = dy / maxDist;}function resetJoystick() { joyActive = false; thumb.style.transform = 'translate(0px,0px)'; joyVec.x = 0; joyVec.y = 0; }stickZone.addEventListener('mousedown', (e) => { e.preventDefault(); joyActive = true; updateJoystick(e.clientX, e.clientY); });window.addEventListener('mousemove', (e) => { if(joyActive) updateJoystick(e.clientX, e.clientY); });window.addEventListener('mouseup', resetJoystick);stickZone.addEventListener('touchstart', (e) => { e.preventDefault(); const t=e.touches[0]; joyActive=true; updateJoystick(t.clientX, t.clientY); });window.addEventListener('touchmove', (e) => { if(joyActive && e.touches[0]) updateJoystick(e.touches[0].clientX, e.touches[0].clientY); });window.addEventListener('touchend', resetJoystick);// -------------------- MOVEMENT --------------------function movePlayer(delta) {    let speed = 5.5 * speedMult;    if(mountActive) {        if(mountLevel===1) speed *= 2;        else if(mountLevel===2) speed *= 2.5;        else if(mountLevel===3) speed *= 3;    }    let dx = joyVec.x * speed * delta;    let dz = joyVec.y * speed * delta;    let nx = player.position.x + dx, nz = player.position.z + dz;    if(Math.abs(nx) > 11.5) nx = player.position.x;    if(Math.abs(nz) > 11.5) nz = player.position.z;    for(let h of houses) {        if(Math.abs(nx - h.x) < h.w/2 + 0.6 && Math.abs(nz - h.z) < h.d/2 + 0.6) {            nx = player.position.x; nz = player.position.z; break;        }    }    player.position.set(nx, -0.3, nz);    if(Math.abs(joyVec.x) > 0.05 || Math.abs(joyVec.y) > 0.05) {        player.rotation.y = Math.atan2(joyVec.x, joyVec.y);    }    enemies.forEach(e => e.update(delta, player.position));    if(currentBoss) updateBoss(delta, player.position);    collectCoins();    updateCompanion();    if(!dungeonActive && player.position.distanceTo(portalRing.position) < 1.2) enterDungeon();}function updateCamera() {    const offset = new THREE.Vector3(-5, 4.5, 7);    const target = player.position.clone().add(offset);    camera.position.lerp(target, 0.1);    camera.lookAt(player.position);}let attackCd = false;document.getElementById('attackBtn').onclick = () => {    if(attackCd) return;    let nearest = null, minDist = 2.0;    enemies.forEach(e => { let d = player.position.distanceTo(e.group.position); if(d < minDist) { minDist = d; nearest = e; } });    if(currentBoss && player.position.distanceTo(currentBoss.group.position) < 2) nearest = currentBoss;    if(nearest) {        let dmg = atk + Math.floor(Math.random() * 8);        nearest.takeDamage(dmg);        showFloatingText(`-${dmg}`, "#ff8844", nearest.group.position);        attackCd = true;        setTimeout(() => attackCd = false, 600);        sounds.attack();    } else showFloatingText("Aucun ennemi!", "#aaa", player.position);};let aoeCd = false;document.getElementById('aoeBtn').onclick = () => {    if(aoeCd) return;    if(mana < 40) { showFloatingText("Pas assez de mana!", "#aaa", player.position); return; }    mana -= 40;    updateUI();    let dmg = atk + 15;    if(level >= 20 && classChoice === 'mage') dmg += 50;    enemies.forEach(e => { if(player.position.distanceTo(e.group.position) < 3.5) e.takeDamage(dmg); });    if(currentBoss && player.position.distanceTo(currentBoss.group.position) < 4) currentBoss.takeDamage(dmg);    showFloatingText("🔥 Boule de feu!", "#ff8844", player.position);    aoeCd = true;    setTimeout(() => aoeCd = false, 800);    sounds.magic();};// -------------------- MENUS --------------------function openModal(id) { document.getElementById(id).style.display = 'flex'; }function closeModal(id) { document.getElementById(id).style.display = 'none'; }document.querySelectorAll('.close-modal').forEach(btn => btn.onclick = () => closeModal(btn.dataset.modal));document.getElementById('menuBtn').onclick = () => openModal('mainMenuModal');document.getElementById('openShopBtn').onclick = () => { closeModal('mainMenuModal'); openModal('shopModal'); refreshShop(); };document.getElementById('openEquipBtn').onclick = () => { closeModal('mainMenuModal'); openModal('equipModal'); refreshEquip(); };document.getElementById('openSkillsBtn').onclick = () => { closeModal('mainMenuModal'); openModal('skillsModal'); refreshSkills(); };document.getElementById('openCraftBtn').onclick = () => { closeModal('mainMenuModal'); openModal('craftModal'); refreshCraft(); };document.getElementById('openMountBtn').onclick = () => { closeModal('mainMenuModal'); openModal('mountModal'); refreshMount(); };document.getElementById('openCompanionBtn').onclick = () => { closeModal('mainMenuModal'); openModal('companionModal'); refreshCompanion(); };document.getElementById('openDailyBtn').onclick = () => { closeModal('mainMenuModal'); openModal('dailyModal'); updateDailyQuestUI(); };document.getElementById('openLeaderboardBtn').onclick = () => { closeModal('mainMenuModal'); openModal('leaderboardModal'); refreshLeaderboard(); };document.getElementById('openPremiumBtn').onclick = () => { closeModal('mainMenuModal'); openModal('premiumModal'); refreshPremium(); };document.getElementById('shareBtn').onclick = () => {    navigator.clipboard.writeText(`Niveau ${level}, ${coins}🪙, ${gems}💎 dans Dreadrock RPG !`);    showFloatingText("Statistiques copiées !","#88ff88",player.position);};function refreshCompanion() {    const div = document.getElementById('companionStatus');    div.innerHTML = companionActive ? "Compagnon actif" : "Pas de compagnon";    document.getElementById('buyCompanionBtn').onclick = buyCompanion;}// -------------------- DAY/NIGHT --------------------let dayTime = 0;function updateDayNight() {    dayTime += 0.002;    if(dayTime > 1) dayTime -= 1;    let intensity = Math.max(0.2, Math.sin(dayTime * Math.PI));    dirLight.intensity = intensity;    ambient.intensity = 0.4 + (1-intensity)*0.3;    const hour = Math.floor(dayTime * 24);    if(hour === 18 && !currentBoss) spawnBoss();    document.getElementById('timeIndicator').innerHTML = intensity > 0.6 ? "☀️ Jour" : "🌙 Nuit";}let weatherTimer = 0;function updateWeather(delta) {    weatherTimer -= delta;    if(weatherTimer <= 0) {        weatherTimer = 120;        const r = Math.random();        if(r < 0.3) scene.fog.density = 0.008;        else if(r < 0.6) scene.fog.density = 0.02;        else scene.fog.density = 0.05;    }}// -------------------- SAVE/LOAD --------------------function saveGame() {    const data = { coins, gems, atk, maxHp, level, xp, xpNeeded, skills, equipment, skillPoints, mountActive, companionActive, classChoice, mountLevel, totalKills, reputation };    localStorage.setItem('dreadrock_save', JSON.stringify(data));}function loadGame() {    const s = localStorage.getItem('dreadrock_save');    if(s) {        const d = JSON.parse(s);        coins = d.coins||0; gems = d.gems||0; atk = d.atk||18; maxHp = d.maxHp||100; hp = maxHp;        level = d.level||1; xp = d.xp||0; xpNeeded = d.xpNeeded||100;        skills = d.skills||{warrior:0,mage:0,rogue:0};        equipment = d.equipment||{weapon:{name:"Épée de fer",atkBonus:0},armor:{name:"Tunique",hpBonus:0},accessory:{name:"Anneau",manaBonus:0}};        skillPoints = d.skillPoints||0;        mountActive = d.mountActive||false;        companionActive = d.companionActive||false;        classChoice = d.classChoice||null;        mountLevel = d.mountLevel||0;        totalKills = d.totalKills||0;        reputation = d.reputation||0;        applySkills();        updateUI();        if(companionActive) createCompanion();    }    updateXpNeeded();}loadGame();initDailyQuest();// -------------------- ANIMATION --------------------let lastTime = performance.now();function animate() {    const now = performance.now();    let delta = Math.min(0.033, (now - lastTime) / 1000);    lastTime = now;    movePlayer(delta);    updateCamera();    updateDayNight();    updateWeather(delta);    mana = Math.min(maxMana, mana + delta * manaRegen);    updateUI();    renderer.render(scene, camera);    labelRenderer.render(scene, camera);    requestAnimationFrame(animate);}animate();window.addEventListener('resize', () => {    camera.aspect = window.innerWidth / window.innerHeight;    camera.updateProjectionMatrix();    renderer.setSize(window.innerWidth, window.innerHeight);    labelRenderer.setSize(window.innerWidth, window.innerHeight);});document.getElementById('photoBtn').onclick = () => {    document.getElementById('ui').style.display = 'none';    setTimeout(() => {        alert("Mode photo : capture d'écran");        document.getElementById('ui').style.display = 'block';    }, 100);};function showDeathAd() {    if(isDead) return;    isDead = true;    const overlay = document.createElement('div');    overlay.style.position = 'fixed'; overlay.style.top = 0; overlay.style.left = 0;    overlay.style.width = '100%'; overlay.style.height = '100%';    overlay.style.background = 'rgba(0,0,0,0.9)'; overlay.style.display = 'flex';    overlay.style.alignItems = 'center'; overlay.style.justifyContent = 'center';    overlay.style.zIndex = 2000;    overlay.innerHTML = `<div style="background:#2a2a1a; padding:30px; border-radius:30px;"><h2>💀 TU ES MORT 💀</h2><p>Publicité (5s)</p><div id="adTimer">5</div></div>`;    document.body.appendChild(overlay);    let t = 5;    const timer = overlay.querySelector('#adTimer');    const int = setInterval(() => {        t--;        timer.textContent = t;        if(t <= 0) {            clearInterval(int);            overlay.remove();            hp = maxHp;            player.position.set(0,-0.3,0);            isDead = false;            updateUI();            showFloatingText("Réapparition !", "#88ff88", player.position);        }    }, 1000);}let isDead = false;</script></body></html>

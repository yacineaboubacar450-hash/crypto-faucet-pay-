<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonceur - YCash Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* TOUS VOS STYLES ORIGINAUX CONSERVÉS */
        :root {
            --primary: #00f2fe; --primary-dark: #00d4ff; --accent: #ff00cc;
            --success: #00ff88; --danger: #ff5757; --warning: #ffc107;
            --dark: #0a0e27; --darker: #0f1729; --card-bg: rgba(20, 30, 60, 0.6);
            --glass: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a2847 50%, #0d1629 100%); color: white; min-height: 100vh; }
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 10px 18px; border-radius: 20px; display: flex; align-items: center; gap: 10px; }
        main { margin-top: 100px; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--glass); border: 2px solid var(--glass-border); border-radius: 20px; padding: 25px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 900; color: var(--primary); }
        .tabs { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 2px solid var(--glass-border); }
        .tab-btn { background: none; border: none; color: #aaa; padding: 15px; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; color: #aaa; }
        .form-input, .form-select, .form-textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: white; margin-top: 5px; }
        .form-input:focus, .form-select:focus { border-color: var(--primary); outline: none; }
        .btn-success { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--dark); border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-deposit { background: var(--success); color: black; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: 20px; height: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">📢 YCASH ADVERTISER</div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="user-card" id="user-card">
                    <div id="user-email-header">Chargement...</div>
                </div>
                <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">← Quitter</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Espace Publicitaire</h1>
            <p>Utilisez votre solde pour promouvoir vos liens et applications.</p>
            <button class="btn-deposit" onclick="requestDeposit()">➕ FAIRE UN DÉPÔT</button>
        </section>

        <div class="admin-stats">
            <div class="stat-card">
                <div style="color:#aaa; font-size:0.8rem;">SOLDE DISPONIBLE</div>
                <div class="stat-value" id="stat-adv-balance">0.0000$</div>
            </div>
            <div class="stat-card">
                <div style="color:#aaa; font-size:0.8rem;">VUES REÇUES</div>
                <div class="stat-value" id="stat-impressions">0</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-surf')">🏄 Créer Surf Ads</button>
            <button class="tab-btn" onclick="switchTab('tab-task')">📝 Créer Mission</button>
        </div>

        <!-- TAB SURF -->
        <div id="tab-surf" class="tab-content active">
            <div class="section">
                <h3>🌐 Nouvelle Campagne Surf (0.0005$ / vue)</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Titre de la pub</label>
                        <input type="text" id="surf-title" class="form-input" placeholder="Titre accrocheur">
                    </div>
                    <div class="form-group">
                        <label>URL du lien</label>
                        <input type="url" id="surf-url" class="form-input" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Nombre de vues</label>
                        <input type="number" id="surf-count" class="form-input" value="100" min="1" oninput="updateCost('surf')">
                    </div>
                </div>
                <div style="padding: 15px; background: rgba(0,242,254,0.1); border-radius: 10px; margin-bottom: 20px;">
                    Coût Total : <span id="cost-surf" style="font-weight: bold; color: var(--primary);">0.0500$</span>
                </div>
                <button class="btn-success" onclick="createCampaign('surf')">LANCER LA CAMPAGNE SURF</button>
            </div>
        </div>

        <!-- TAB TASK -->
        <div id="tab-task" class="tab-content">
            <div class="section">
                <h3>📝 Nouvelle Mission</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Type de mission</label>
                        <select id="task-type" class="form-select" onchange="updateCost('task')">
                            <option value="app">📱 Télécharger une App (0.005$)</option>
                            <option value="signup">✍️ S'inscrire (0.002$)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Titre</label>
                        <input type="text" id="task-title" class="form-input" placeholder="ex: Installer Telegram">
                    </div>
                    <div class="form-group">
                        <label>URL de validation</label>
                        <input type="url" id="task-url" class="form-input" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Nombre de personnes</label>
                        <input type="number" id="task-count" class="form-input" value="10" min="1" oninput="updateCost('task')">
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="task-auto" checked>
                    <label for="task-auto">Validation automatique (l'utilisateur est crédité immédiatement)</label>
                </div>
                <div style="padding: 15px; background: rgba(0,242,254,0.1); border-radius: 10px; margin: 20px 0;">
                    Coût Total : <span id="cost-task" style="font-weight: bold; color: var(--primary);">0.0500$</span>
                </div>
                <button class="btn-success" onclick="createCampaign('task')">PUBLIER LA MISSION</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, collection, addDoc, updateDoc, increment, serverTimestamp, runTransaction, query, where, getDocs 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwPBl7Cq2v_fyza9d3o_SwvYbDAk4hzcA",
            authDomain: "ycash-enpire-v2.firebaseapp.com",
            projectId: "ycash-enpire-v2",
            storageBucket: "ycash-enpire-v2.firebasestorage.app",
            messagingSenderId: "697841513435",
            appId: "1:697841513435:web:b5a808cf8572e96c7f6dfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const PRICES = { surf: 0.0005, app: 0.005, signup: 0.002 };

        // Redirection si non connecté
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUser = user;
            document.getElementById('user-email-header').innerText = user.email;
            await loadBalanceAndStats();
        });

        // Charger le solde et le nombre total d'impressions reçues
        async function loadBalanceAndStats() {
            if (!currentUser) return;
            try {
                // Solde
                const userSnap = await getDoc(doc(db, "users", currentUser.uid));
                if (userSnap.exists()) {
                    document.getElementById('stat-adv-balance').innerText = userSnap.data().balance.toFixed(4) + "$";
                }

                // Impressions (vues sur les surf + remplissages de missions)
                let totalImpressions = 0;

                // Surfs créées par cet utilisateur
                const surfsQuery = query(collection(db, "surfs"), where("createdBy", "==", currentUser.uid));
                const surfsSnap = await getDocs(surfsQuery);
                surfsSnap.forEach(doc => {
                    totalImpressions += doc.data().clicksCompleted || 0;
                });

                // Missions créées par cet utilisateur
                const tasksQuery = query(collection(db, "tasks"), where("advertiser", "==", currentUser.uid));
                const tasksSnap = await getDocs(tasksQuery);
                tasksSnap.forEach(doc => {
                    totalImpressions += doc.data().slotsFilled || 0;
                });

                document.getElementById('stat-impressions').innerText = totalImpressions;
            } catch (error) {
                console.error("Erreur chargement stats:", error);
            }
        }

        // Mise à jour du coût total affiché
        window.updateCost = (type) => {
            if (type === 'surf') {
                const count = parseInt(document.getElementById('surf-count').value) || 0;
                document.getElementById('cost-surf').innerText = (count * PRICES.surf).toFixed(4) + "$";
            } else {
                const mode = document.getElementById('task-type').value;
                const count = parseInt(document.getElementById('task-count').value) || 0;
                document.getElementById('cost-task').innerText = (count * PRICES[mode]).toFixed(4) + "$";
            }
        };

        // Création d'une campagne (surf ou task)
        window.createCampaign = async (type) => {
            if (!currentUser) return;

            // Récupération des valeurs communes
            const countInput = type === 'surf' ? 'surf-count' : 'task-count';
            const count = parseInt(document.getElementById(countInput).value);
            const title = document.getElementById(type === 'surf' ? 'surf-title' : 'task-title').value;

            if (!title || count <= 0) {
                alert("Veuillez remplir tous les champs correctement.");
                return;
            }

            let unitPrice, totalCost;
            if (type === 'surf') {
                unitPrice = PRICES.surf;
                totalCost = unitPrice * count;
            } else {
                const taskType = document.getElementById('task-type').value;
                unitPrice = PRICES[taskType];
                totalCost = unitPrice * count;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    // Vérifier le solde de l'utilisateur
                    const userRef = doc(db, "users", currentUser.uid);
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw new Error("Utilisateur introuvable");
                    const userData = userSnap.data();
                    if (userData.balance < totalCost) {
                        throw new Error(`Solde insuffisant. Il vous manque ${(totalCost - userData.balance).toFixed(4)}$`);
                    }

                    // Déduire le montant
                    transaction.update(userRef, {
                        balance: increment(-totalCost)
                    });

                    if (type === 'surf') {
                        const url = document.getElementById('surf-url').value;
                        if (!url) throw new Error("L'URL est obligatoire");

                        // Créer le document surf
                        const newSurfRef = doc(collection(db, "surfs"));
                        transaction.set(newSurfRef, {
                            title: title,
                            url: url,
                            reward: unitPrice,
                            clicksRemaining: count,
                            clicksCompleted: 0,
                            status: "active",
                            createdBy: currentUser.uid,
                            createdAt: serverTimestamp(),
                            duration: 15  // temps de visualisation en secondes (par défaut)
                        });
                    } else {
                        // Task
                        const url = document.getElementById('task-url').value;
                        if (!url) throw new Error("L'URL de validation est obligatoire");
                        const autoValidate = document.getElementById('task-auto').checked;

                        // Créer le document task (avec les champs observés dans la base)
                        const newTaskRef = doc(collection(db, "tasks"));
                        transaction.set(newTaskRef, {
                            title: title,
                            validationlink: url,
                            reward: unitPrice,
                            totalSlots: count,
                            slotsFilled: 0,
                            status: "active",
                            advertiser: currentUser.uid,
                            createdAt: serverTimestamp(),
                            autoValidate: autoValidate,
                            // Champs supplémentaires pour compatibilité
                            autovalidat: autoValidate,
                            category: "",
                            description: "",
                            difficulty: "facile",
                            estimatedtime: "5 min",
                            creatidAt: 0 // pour correspondre à l'existant (peut être ignoré)
                        });
                    }
                });

                alert("✅ Campagne lancée avec succès !");
                // Recharger les stats
                await loadBalanceAndStats();
                // Réinitialiser les champs (optionnel)
                if (type === 'surf') {
                    document.getElementById('surf-title').value = '';
                    document.getElementById('surf-url').value = '';
                } else {
                    document.getElementById('task-title').value = '';
                    document.getElementById('task-url').value = '';
                }
            } catch (error) {
                alert("❌ Erreur : " + error.message);
            }
        };

// Demande de dépôt avec preuve
window.requestDeposit = async () => {
    if (!currentUser) return;
    
    // Montant minimum
    const amount = prompt("Montant du dépôt ($) : (minimum 5$)", "10");
    if (!amount || isNaN(amount) || parseFloat(amount) < 5) {
        alert("Le montant minimum est de 5$.");
        return;
    }

    try {
        // 1. Créer une alerte pour l'admin (collection "alerts")
        await addDoc(collection(db, "alerts"), {
            message: `💰 DEMANDE DÉPÔT: ${amount}$ de ${currentUser.email} (UID: ${currentUser.uid})`,
            target: "all",
            timestamp: serverTimestamp()
        });

        // 2. Ouvrir l'email pré-rempli avec les adresses crypto et instructions
        const subject = `Dépôt YCash Empire - ${currentUser.email}`;
        const body = `Bonjour,

Je souhaite déposer ${amount}$ sur mon compte YCash Empire.

Mes informations :
- Email : ${currentUser.email}
- UID : ${currentUser.uid}

Adresses pour l'envoi des fonds (choisissez celle qui vous convient) :
- Bitcoin (BTC) : 1LyF1nLbsdsXGeGqbCsLBnekpMaZGvFL5U
- Ethereum (ETH) : 0x6b1fED951a05e12D41b0Ac6a5595F873C0bAA173
- Litecoin (LTC) : ltc1q3rt922f222zz6d6utlurm32wdklnul3euszd7t
- Tron (TRX) : TLgkZmHQ81czHjGB7sF51e3fDGNjMrUENM

J'ai effectué le virement et je joins la preuve de paiement (capture d'écran, hash de transaction, etc.).

Merci de créditer mon compte dès réception.

Cordialement.`;

        window.location.href = `mailto:ycashempirre@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        alert("📧 Email ouvert. Veuillez l'envoyer avec votre preuve de paiement jointe. Dès que les fonds seront reçus et vérifiés, votre solde sera crédité manuellement (généralement sous 24h).");
    } catch (error) {
        console.error("Erreur demande dépôt:", error);
        alert("Erreur lors de la demande. Veuillez réessayer.");
    }
};

        // Changer d'onglet
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            // L'événement currentTarget n'est pas accessible directement, on cherche le bouton cliqué
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.textContent.includes(id === 'tab-surf' ? 'Surf' : 'Mission'));
            if (activeBtn) activeBtn.classList.add('active');
        };

        // Initialisation des coûts
        window.onload = () => {
            updateCost('surf');
            updateCost('task');
        };
    </script>
</body>
</html>
